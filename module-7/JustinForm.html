<!DOCTYPE html>
    <!--
		Justin Morrow - 09/12/26
		Module 7.2
			Create an entry form with 7 fields using 4 different entry types
			Example: Text Field, Check Box, Radio Button, Password, Dropdown Menu
		Code Example used:
			FormAll.html
		To display this page:
			Place file JustinForm.html in c:\xampp\htdocs\ and start xampp
			Then in the browser goto: http://localhost/JustinForm.html
     -->
<html>
	<head>
		<title>Justin's Seahawks Ticket Purchase Form Module 7.2</title>
		<meta charset='utf-8'>
	</head>
	<body>
		<h1>Get Your Seattle Seahawks Tickets!</h1>
		<h3>Please submit the form below:</h3>

		<!-- Entry Form -->
		<form action='JustinResponse.php' method='post'>
			<p>
				<!-- Text field for Name -->
				<label>
					First and Last Name:
					<input name='name' type='text' size='30' />
				</label>
			</p>
			<p>
				<!-- Drop Down for Contact Method -->
				<label>
					Preferred Contact Method:
					<select name='contactMethod'>
						<option selected='selected' value=''>Select One</option>
						<option value='Phone'>Phone</option>
						<option value='Email'>Email</option>
					</select>
				</label>
			</p>
			<p>
				<!-- Text field for Email address -->
				<label>
					Email:
					<input name='email' type='text' size='30' />
				</label>
			</p>
			<p>
				<!-- Text field for Phone number -->
				<label>
					Phone:
					<input name='phone' type='text' size='20' />
				</label>
			</p>
			<p>
				<!-- Drop Down for Number of Tickets -->
				<label>
					Number of Tickets:
					<select name='tickets'>
						<option selected='selected' value=''>Select Number</option>
						<option value='1'>1</option>
						<option value='2'>2</option>
						<option value='3'>3</option>
						<option value='4'>4</option>
					</select>
				</label>
			</p>
			<p>
				<!-- Radio buttons for Seatting Selection/Area -->
				<label>
					Seat Selection:
					<br />
					<!-- Defaulting Any as the selection to avoid php error if left blank -->
					<input name='seats' type='radio' value='Any' checked/>
					Any
				</label>
				<br/>
				<label>
					<input name='seats' type='radio' value='Box' />
					Box
				</label>
				<br/>
				<label>
					<input name='seats' type='radio' value='Chairback' />
					Chairback
				</label>
				<br/>
				<label>
					<input name='seats' type='radio' value='Bleachers' />
					Bleachers
				</label>
			</p>
			<p>
				<!-- Password field for Will Call Secret Phrase -->
				<label>
					Secret Phrase for Will Call Pickup:
					<input name='willCall' type='password' size='25' />
				</label>
			</p>
			<p>
				<!-- Reset and Submit Buttons -->
				<input type='reset' value='Clear Entries' />
				<input type='submit' value='Submit' />
			</p>
		</form>
	</body>
</html>
